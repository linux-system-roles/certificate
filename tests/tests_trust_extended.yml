# SPDX-License-Identifier: MIT
# This file and the extended-format trust feature were generated by ChatGPT
# using model Astra Light 6.
---
- name: Test extended-format trust files
  hosts: all
  vars:
    __sr_public: true
    __certificate_test_name: lsr-extended-test
    __certificate_test_entry:
      - name: "{{ __certificate_test_name }}"
        type: extended
        src: "{{ __certificate_test_dir.path }}/trusted.pem"
        remote_src: true
    __certificate_test_absent:
      - name: "{{ __certificate_test_name }}"
        type: extended
        state: absent
  tasks:
    - name: Skip platforms without extended-format support
      ansible.builtin.meta: end_host
      when: ansible_facts['os_family'] != 'RedHat'

    - name: Test extended-format operations and clean up afterwards
      block:
        - name: Initialize role platform variables
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml

        - name: Ensure openssl is installed
          ansible.builtin.package:
            name: openssl
            state: present
            use: "{{ (__certificate_is_ostree | d(false)) |
              ternary('ansible.posix.rhel_rpm_ostree', omit) }}"

        - name: Create a temporary certificate directory
          ansible.builtin.tempfile:
            state: directory
            prefix: lsr-extended-
          register: __certificate_test_dir

        - name: Generate a test CA
          ansible.builtin.command: >-
            openssl req -x509 -newkey rsa:2048 -nodes -days 1
            -subj /CN=LSR-Extended-Test-CA
            -keyout {{ __certificate_test_dir.path }}/ca.key
            -out {{ __certificate_test_dir.path }}/ca.crt
          changed_when: true

        - name: Add purpose-specific trust flags
          ansible.builtin.command: >-
            openssl x509 -in {{ __certificate_test_dir.path }}/ca.crt
            -addtrust serverAuth -addreject emailProtection -trustout
            -out {{ __certificate_test_dir.path }}/trusted.pem
          changed_when: true

        - name: Predict installation in check mode
          ansible.builtin.include_tasks:
            file: tasks/run_role_with_clear_facts.yml
            apply:
              check_mode: true
              diff: true
          vars:
            certificate_trust: "{{ __certificate_test_entry }}"

        - name: Verify check mode did not install the file
          ansible.builtin.stat:
            path: >-
              {{ __certificate_trust_extended_dir }}/{{
              __certificate_test_name }}.crt
          register: __certificate_test_stat
          failed_when: __certificate_test_stat.stat.exists

        - name: Install an extended-format file from the managed host
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            certificate_trust: "{{ __certificate_test_entry }}"

        - name: Verify installation was reported
          ansible.builtin.assert:
            that: certificate_is_changed

        - name: Read the original extended-format file
          ansible.builtin.slurp:
            src: "{{ __certificate_test_dir.path }}/trusted.pem"
          register: __certificate_test_original

        - name: Read the installed extended-format file
          ansible.builtin.slurp:
            src: >-
              {{ __certificate_trust_extended_dir }}/{{
              __certificate_test_name }}.crt
          register: __certificate_test_installed

        - name: Check installed file attributes
          ansible.builtin.stat:
            path: >-
              {{ __certificate_trust_extended_dir }}/{{
              __certificate_test_name }}.crt
          register: __certificate_test_stat

        - name: Verify content and permissions were preserved
          ansible.builtin.assert:
            that:
              - >-
                __certificate_test_original.content ==
                __certificate_test_installed.content
              - >-
                'BEGIN TRUSTED CERTIFICATE' in
                (__certificate_test_installed.content | b64decode)
              - __certificate_test_stat.stat.mode == '0644'
              - __certificate_test_stat.stat.pw_name == 'root'
              - __certificate_test_stat.stat.gr_name == 'root'

        # Query purpose-specific trust directly; OpenSSL default bundles
        # do not reliably enforce the extended file's email trust policy.
        - name: List certificates trusted for server-auth
          ansible.builtin.command: >-
            trust list --filter=ca-anchors --purpose=server-auth
          register: __certificate_test_server_trust
          changed_when: false

        - name: List certificates trusted for email
          ansible.builtin.command: >-
            trust list --filter=ca-anchors --purpose=email
          register: __certificate_test_email_trust
          changed_when: false

        - name: Verify server authentication is trusted and email is not
          ansible.builtin.assert:
            that:
              - >-
                'label: LSR-Extended-Test-CA' in
                (__certificate_test_server_trust.stdout_lines |
                map('trim') | list)
              - >-
                'label: LSR-Extended-Test-CA' not in
                (__certificate_test_email_trust.stdout_lines |
                map('trim') | list)

        - name: Apply the same file as inline content
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            certificate_trust:
              - name: "{{ __certificate_test_name }}"
                type: extended
                content: "{{ __certificate_test_original.content | b64decode }}"

        - name: Verify inline installation is idempotent
          ansible.builtin.assert:
            that: not certificate_is_changed

        - name: Change the extended file to trust email instead
          ansible.builtin.command: >-
            openssl x509 -in {{ __certificate_test_dir.path }}/ca.crt
            -addtrust emailProtection -addreject serverAuth -trustout
            -out {{ __certificate_test_dir.path }}/trusted.pem
          changed_when: true

        # A file URL exercises get_url without requiring an HTTP server.
        - name: Update the extended-format file from a URL
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            certificate_trust:
              - name: "{{ __certificate_test_name }}"
                type: extended
                url: "file://{{ __certificate_test_dir.path }}/trusted.pem"

        - name: Verify the policy update was reported
          ansible.builtin.assert:
            that: certificate_is_changed

        - name: List certificates trusted for email
          ansible.builtin.command: >-
            trust list --filter=ca-anchors --purpose=email
          register: __certificate_test_email_trust
          changed_when: false

        - name: Verify email authentication is now trusted
          ansible.builtin.assert:
            that:
              - >-
                'label: LSR-Extended-Test-CA' in
                (__certificate_test_email_trust.stdout_lines |
                map('trim') | list)

        - name: Predict removal in check mode
          ansible.builtin.include_tasks:
            file: tasks/run_role_with_clear_facts.yml
            apply:
              check_mode: true
              diff: true
          vars:
            certificate_trust: "{{ __certificate_test_absent }}"

        - name: Verify check mode preserved the file
          ansible.builtin.stat:
            path: >-
              {{ __certificate_trust_extended_dir }}/{{
              __certificate_test_name }}.crt
          register: __certificate_test_stat
          failed_when: not __certificate_test_stat.stat.exists

        - name: Remove the extended-format file
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            certificate_trust: "{{ __certificate_test_absent }}"

        - name: Verify removal was reported
          ansible.builtin.assert:
            that: certificate_is_changed

        - name: Verify the file was removed
          ansible.builtin.stat:
            path: >-
              {{ __certificate_trust_extended_dir }}/{{
              __certificate_test_name }}.crt
          register: __certificate_test_stat
          failed_when: __certificate_test_stat.stat.exists

        - name: List certificates trusted for email
          ansible.builtin.command: >-
            trust list --filter=ca-anchors --purpose=email
          register: __certificate_test_email_trust
          changed_when: false

        - name: Verify the CA is no longer trusted for email
          ansible.builtin.assert:
            that:
              - >-
                'label: LSR-Extended-Test-CA' not in
                (__certificate_test_email_trust.stdout_lines |
                map('trim') | list)

        - name: Remove the extended-format file again
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            certificate_trust: "{{ __certificate_test_absent }}"

        - name: Verify removal is idempotent
          ansible.builtin.assert:
            that: not certificate_is_changed
      always:
        - name: Remove test trust entry
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            certificate_trust: "{{ __certificate_test_absent }}"
          tags: tests::cleanup

        - name: Remove temporary certificate directory
          ansible.builtin.file:
            path: "{{ __certificate_test_dir.path }}"
            state: absent
          when: __certificate_test_dir.path is defined
          tags: tests::cleanup
