---
- name: Test certificate generation with key_size
  hosts: all
  vars:
    certificate_requests:
      - name: mycert_key_size
        dns: www.example.com
        ca: self-sign
        key_size: 1024

  tasks:
    - name: Include role, ignore fail if certmonger version is not supported
      block:
        - name: Request certificate with key size
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            __sr_public: true

        - name: Check idempotency if system is booted
          when: __certificate_is_booted
          block:
            - name: Run the role again to test idempotency
              include_tasks: tasks/run_role_with_clear_facts.yml

            - name: Assert no changes were made
              assert:
                that: not certificate_is_changed
                fail_msg: "Certificate was changed when it should not have been"

        - name: Load certificate role platform variables
          include_role:
            name: linux-system-roles.certificate
            tasks_from: set_vars.yml
            public: true

        - name: Verify each certificate
          include_tasks: tasks/assert_certificate_parameters.yml
          loop: "{{ certificates }}"
          loop_control:
            loop_var: cert
          vars:
            certificates:
              - path: "{{ __certificate_default_directory }}/certs/mycert_key_size.crt"
                key_path: "{{ __certificate_default_directory }}/private/mycert_key_size.key"
                subject:
                  - name: commonName
                    oid: 2.5.4.3
                    value: www.example.com
                subject_alt_name:
                  - name: DNS
                    value: www.example.com
                key_size: 1024
      rescue:
        - name: Clear host errors if certmonger version is not supported
          meta: clear_host_errors
          when: version_error in ansible_failed_result.results[0].msg
          vars:
            version_error: >-
              certmonger version does not support attribute 'key_size'
