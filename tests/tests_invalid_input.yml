# SPDX-License-Identifier: MIT
---
- name: Verify argument specs reject invalid parameters
  hosts: all
  tasks:
    # --- certificate_requests validation ---
    # Role argument validation requires Ansible 2.10+; skipped on older versions.

    - name: Argument specs reject missing name in certificate_requests
      when: ansible_version.full is version('2.10', '>=')
      block:
        - name: Run role with certificate_requests missing name
          ansible.builtin.include_role:
            name: linux-system-roles.certificate
          vars:
            certificate_requests:
              - ca: self-sign
                dns: www.example.com
      rescue:
        - name: Mark missing name rejected
          ansible.builtin.set_fact:
            __invalid_input_missing_name_failed: true

    - name: Assert missing name in certificate_requests failed validation
      when: ansible_version.full is version('2.10', '>=')
      ansible.builtin.assert:
        that:
          - __invalid_input_missing_name_failed | default(false)
        fail_msg: >-
          meta/argument_specs should reject certificate_requests entries
          without the required name field

    - name: Argument specs reject missing ca in certificate_requests
      when: ansible_version.full is version('2.10', '>=')
      block:
        - name: Run role with certificate_requests missing ca
          ansible.builtin.include_role:
            name: linux-system-roles.certificate
          vars:
            certificate_requests:
              - name: mycert
                dns: www.example.com
      rescue:
        - name: Mark missing ca rejected
          ansible.builtin.set_fact:
            __invalid_input_missing_ca_failed: true

    - name: Assert missing ca in certificate_requests failed validation
      when: ansible_version.full is version('2.10', '>=')
      ansible.builtin.assert:
        that:
          - __invalid_input_missing_ca_failed | default(false)
        fail_msg: >-
          meta/argument_specs should reject certificate_requests entries
          without the required ca field

    - name: Argument specs reject invalid key_size type
      when: ansible_version.full is version('2.10', '>=')
      block:
        - name: Run role with key_size as string
          ansible.builtin.include_role:
            name: linux-system-roles.certificate
          vars:
            certificate_requests:
              - name: mycert
                ca: self-sign
                key_size: not_a_number
      rescue:
        - name: Mark invalid key_size rejected
          ansible.builtin.set_fact:
            __invalid_input_key_size_type_failed: true

    - name: Assert invalid key_size type failed validation
      when: ansible_version.full is version('2.10', '>=')
      ansible.builtin.assert:
        that:
          - __invalid_input_key_size_type_failed | default(false)
        fail_msg: >-
          meta/argument_specs should reject key_size values that
          are not integers

    - name: Argument specs reject invalid auto_renew type
      when: ansible_version.full is version('2.10', '>=')
      block:
        - name: Run role with auto_renew as string
          ansible.builtin.include_role:
            name: linux-system-roles.certificate
          vars:
            certificate_requests:
              - name: mycert
                ca: self-sign
                auto_renew: not_a_bool
      rescue:
        - name: Mark invalid auto_renew rejected
          ansible.builtin.set_fact:
            __invalid_input_auto_renew_type_failed: true

    - name: Assert invalid auto_renew type failed validation
      when: ansible_version.full is version('2.10', '>=')
      ansible.builtin.assert:
        that:
          - __invalid_input_auto_renew_type_failed | default(false)
        fail_msg: >-
          meta/argument_specs should reject auto_renew values that
          are not booleans

    # --- certificate_wait validation ---

    - name: Argument specs reject invalid certificate_wait type
      when: ansible_version.full is version('2.10', '>=')
      block:
        - name: Run role with certificate_wait as string
          ansible.builtin.include_role:
            name: linux-system-roles.certificate
          vars:
            certificate_wait: not_a_bool
      rescue:
        - name: Mark invalid certificate_wait rejected
          ansible.builtin.set_fact:
            __invalid_input_wait_type_failed: true

    - name: Assert invalid certificate_wait type failed validation
      when: ansible_version.full is version('2.10', '>=')
      ansible.builtin.assert:
        that:
          - __invalid_input_wait_type_failed | default(false)
        fail_msg: >-
          meta/argument_specs should reject certificate_wait values
          that are not booleans

    # --- certificate_trust validation ---

    - name: Argument specs reject missing name in certificate_trust
      when: ansible_version.full is version('2.10', '>=')
      block:
        - name: Run role with certificate_trust missing name
          ansible.builtin.include_role:
            name: linux-system-roles.certificate
          vars:
            certificate_trust:
              - content: not-a-certificate
                state: present
      rescue:
        - name: Mark missing trust name rejected
          ansible.builtin.set_fact:
            __invalid_input_trust_missing_name_failed: true

    - name: Assert missing name in certificate_trust failed validation
      when: ansible_version.full is version('2.10', '>=')
      ansible.builtin.assert:
        that:
          - __invalid_input_trust_missing_name_failed | default(false)
        fail_msg: >-
          meta/argument_specs should reject certificate_trust entries
          without the required name field

    - name: Argument specs reject invalid state in certificate_trust
      when: ansible_version.full is version('2.10', '>=')
      block:
        - name: Run role with invalid trust state
          ansible.builtin.include_role:
            name: linux-system-roles.certificate
          vars:
            certificate_trust:
              - name: mycert
                content: not-a-certificate
                state: invalid_state
      rescue:
        - name: Mark invalid trust state rejected
          ansible.builtin.set_fact:
            __invalid_input_trust_state_failed: true

    - name: Assert invalid state in certificate_trust failed validation
      when: ansible_version.full is version('2.10', '>=')
      ansible.builtin.assert:
        that:
          - __invalid_input_trust_state_failed | default(false)
        fail_msg: >-
          meta/argument_specs should reject certificate_trust state
          values outside the allowed set (present, absent)
