# SPDX-License-Identifier: MIT
---
- name: Verify invalid parameters are rejected
  hosts: all
  tasks:
    - name: Run invalid input tests
      block:
        # --- Valid invocation to confirm argument_specs accept defaults ---

        - name: Run role with valid defaults
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml

        - name: Mark valid defaults succeeded
          ansible.builtin.set_fact:
            __valid_defaults_succeeded: true

        - name: Assert role completed with valid defaults
          ansible.builtin.assert:
            that:
              - __valid_defaults_succeeded | default(false)
            fail_msg: >-
              Role should succeed with default parameters

        # --- argument_specs validation ---
        # Role argument validation requires Ansible 2.10+; skipped on older versions.

        - name: Run argument specs validation tests
          when: ansible_version.full is version('2.10', '>=')
          block:
            - name: Argument specs reject missing name in certificate_requests
              block:
                - name: Run role with certificate_requests missing name
                  ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
                  vars:
                    certificate_requests:
                      - ca: self-sign
                        dns: www.example.com
              rescue:
                - name: Mark missing name rejected
                  ansible.builtin.set_fact:
                    __invalid_input_missing_name_failed: true

            - name: Assert missing name in certificate_requests failed validation
              ansible.builtin.assert:
                that:
                  - __invalid_input_missing_name_failed | default(false)
                fail_msg: >-
                  meta/argument_specs should reject certificate_requests entries
                  without the required name field

            - name: Argument specs reject missing ca in certificate_requests
              block:
                - name: Run role with certificate_requests missing ca
                  ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
                  vars:
                    certificate_requests:
                      - name: mycert
                        dns: www.example.com
              rescue:
                - name: Mark missing ca rejected
                  ansible.builtin.set_fact:
                    __invalid_input_missing_ca_failed: true

            - name: Assert missing ca in certificate_requests failed validation
              ansible.builtin.assert:
                that:
                  - __invalid_input_missing_ca_failed | default(false)
                fail_msg: >-
                  meta/argument_specs should reject certificate_requests entries
                  without the required ca field

            - name: Argument specs reject invalid key_size type
              block:
                - name: Run role with key_size as string
                  ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
                  vars:
                    certificate_requests:
                      - name: mycert
                        ca: self-sign
                        key_size: not_a_number
              rescue:
                - name: Mark invalid key_size rejected
                  ansible.builtin.set_fact:
                    __invalid_input_key_size_type_failed: true

            - name: Assert invalid key_size type failed validation
              ansible.builtin.assert:
                that:
                  - __invalid_input_key_size_type_failed | default(false)
                fail_msg: >-
                  meta/argument_specs should reject key_size values that
                  are not integers

            - name: Argument specs reject invalid auto_renew type
              block:
                - name: Run role with auto_renew as string
                  ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
                  vars:
                    certificate_requests:
                      - name: mycert
                        ca: self-sign
                        auto_renew: not_a_bool
              rescue:
                - name: Mark invalid auto_renew rejected
                  ansible.builtin.set_fact:
                    __invalid_input_auto_renew_type_failed: true

            - name: Assert invalid auto_renew type failed validation
              ansible.builtin.assert:
                that:
                  - __invalid_input_auto_renew_type_failed | default(false)
                fail_msg: >-
                  meta/argument_specs should reject auto_renew values that
                  are not booleans

            - name: Argument specs reject invalid certificate_wait type
              block:
                - name: Run role with certificate_wait as string
                  ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
                  vars:
                    certificate_wait: not_a_bool
              rescue:
                - name: Mark invalid certificate_wait rejected
                  ansible.builtin.set_fact:
                    __invalid_input_wait_type_failed: true

            - name: Assert invalid certificate_wait type failed validation
              ansible.builtin.assert:
                that:
                  - __invalid_input_wait_type_failed | default(false)
                fail_msg: >-
                  meta/argument_specs should reject certificate_wait values
                  that are not booleans

            - name: Argument specs reject missing name in certificate_trust
              block:
                - name: Run role with certificate_trust missing name
                  ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
                  vars:
                    certificate_trust:
                      - content: not-a-certificate
                        state: present
              rescue:
                - name: Mark missing trust name rejected
                  ansible.builtin.set_fact:
                    __invalid_input_trust_missing_name_failed: true

            - name: Assert missing name in certificate_trust failed validation
              ansible.builtin.assert:
                that:
                  - __invalid_input_trust_missing_name_failed | default(false)
                fail_msg: >-
                  meta/argument_specs should reject certificate_trust entries
                  without the required name field

            - name: Argument specs reject invalid key_usage choice
              block:
                - name: Run role with invalid key_usage value
                  ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
                  vars:
                    certificate_requests:
                      - name: mycert
                        ca: self-sign
                        key_usage:
                          - digitalSignature
                          - invalidUsage
              rescue:
                - name: Mark invalid key_usage rejected
                  ansible.builtin.set_fact:
                    __invalid_input_key_usage_choice_failed: true

            - name: Assert invalid key_usage choice failed validation
              ansible.builtin.assert:
                that:
                  - __invalid_input_key_usage_choice_failed | default(false)
                fail_msg: >-
                  meta/argument_specs should reject key_usage values
                  not in the allowed choices list

            - name: Argument specs reject invalid state in certificate_trust
              block:
                - name: Run role with invalid trust state
                  ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
                  vars:
                    certificate_trust:
                      - name: mycert
                        content: not-a-certificate
                        state: invalid_state
              rescue:
                - name: Mark invalid trust state rejected
                  ansible.builtin.set_fact:
                    __invalid_input_trust_state_failed: true

            - name: Assert invalid state in certificate_trust failed validation
              ansible.builtin.assert:
                that:
                  - __invalid_input_trust_state_failed | default(false)
                fail_msg: >-
                  meta/argument_specs should reject certificate_trust state
                  values outside the allowed set (present, absent)

        # --- certificate_trust cross-field validation (assert in tasks, not argument_specs) ---

        - name: Assert rejects trust entry with no source when state is present
          block:
            - name: Run role with trust entry missing content, src, and url
              ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                certificate_trust:
                  - name: mycert
                    state: present
          rescue:
            - name: Mark missing trust source rejected
              ansible.builtin.set_fact:
                __invalid_input_trust_no_source_failed: true

        - name: Assert trust entry with no source failed validation
          ansible.builtin.assert:
            that:
              - __invalid_input_trust_no_source_failed | default(false)
            fail_msg: >-
              certificate_trust should reject entries with state present
              that do not specify exactly one of content, src, or url

        # --- assert_role_vars validation (raw type fields) ---

        - name: Assert rejects dns as integer
          block:
            - name: Run role with dns as integer
              ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                certificate_requests:
                  - name: mycert
                    ca: self-sign
                    dns: 12345
          rescue:
            - name: Mark invalid dns type rejected
              ansible.builtin.set_fact:
                __invalid_input_dns_type_failed: true

        - name: Assert dns as integer failed validation
          ansible.builtin.assert:
            that:
              - __invalid_input_dns_type_failed | default(false)
            fail_msg: >-
              assert_role_vars should reject dns values that are not
              a string or list

        - name: Assert rejects dns list with non-string element
          block:
            - name: Run role with dns list containing integer
              ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                certificate_requests:
                  - name: mycert
                    ca: self-sign
                    dns:
                      - www.example.com
                      - 12345
          rescue:
            - name: Mark dns list element rejected
              ansible.builtin.set_fact:
                __invalid_input_dns_element_failed: true

        - name: Assert dns list with non-string element failed validation
          ansible.builtin.assert:
            that:
              - __invalid_input_dns_element_failed | default(false)
            fail_msg: >-
              assert_role_vars should reject dns lists containing
              non-string elements

        - name: Assert rejects ip as boolean
          block:
            - name: Run role with ip as boolean
              ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                certificate_requests:
                  - name: mycert
                    ca: self-sign
                    ip: true
          rescue:
            - name: Mark invalid ip type rejected
              ansible.builtin.set_fact:
                __invalid_input_ip_type_failed: true

        - name: Assert ip as boolean failed validation
          ansible.builtin.assert:
            that:
              - __invalid_input_ip_type_failed | default(false)
            fail_msg: >-
              assert_role_vars should reject ip values that are not
              a string or list

        - name: Assert rejects mode as boolean
          block:
            - name: Run role with mode as boolean
              ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                certificate_requests:
                  - name: mycert
                    ca: self-sign
                    mode: true
          rescue:
            - name: Mark invalid mode type rejected
              ansible.builtin.set_fact:
                __invalid_input_mode_type_failed: true

        - name: Assert mode as boolean failed validation
          ansible.builtin.assert:
            that:
              - __invalid_input_mode_type_failed | default(false)
            fail_msg: >-
              assert_role_vars should reject mode values that are not
              a string or integer

      always:
        - name: Clear test facts
          ansible.builtin.set_fact:
            __valid_defaults_succeeded:
            __invalid_input_missing_name_failed:
            __invalid_input_missing_ca_failed:
            __invalid_input_key_size_type_failed:
            __invalid_input_auto_renew_type_failed:
            __invalid_input_wait_type_failed:
            __invalid_input_trust_missing_name_failed:
            __invalid_input_key_usage_choice_failed:
            __invalid_input_trust_state_failed:
            __invalid_input_trust_no_source_failed:
            __invalid_input_dns_type_failed:
            __invalid_input_dns_element_failed:
            __invalid_input_ip_type_failed:
            __invalid_input_mode_type_failed:
          tags: tests::cleanup
