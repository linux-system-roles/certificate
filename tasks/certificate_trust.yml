# SPDX-License-Identifier: MIT
# The blocklist feature was added by ChatGPT using model Astra Light 6.
---
- name: Validate certificate_trust items
  assert:
    that:
      - item.name is defined
      - item.state | d('present') in ['present', 'absent']
      - item.type | d('anchor') in ['anchor', 'blocklist', 'extended']
      - >-
        item.state | d('present') == 'absent' or
        [item.content is defined, item.src is defined, item.url is defined] |
        select | list | length == 1
    fail_msg: >-
      Each certificate_trust item must have a name, state must be 'present'
      or 'absent', and exactly one of content, src, or url must be given
      when state is 'present'; type must be 'anchor', 'blocklist', or 'extended'
  loop: "{{ certificate_trust }}"
  loop_control:
    label: "{{ item.name | d('unnamed') }}"
  register: __certificate_trust_validated

- name: Set certificate_is_changed
  set_fact:
    certificate_is_changed: true
  when: __certificate_trust_validated is changed  # noqa no-handler

- name: Validate certificate blocklist support
  ansible.builtin.assert:
    that:
      - >-
        item.type | d('anchor') != 'blocklist'
        or __certificate_trust_blocklist_dir is not none
    fail_msg: Certificate blocklisting is not supported on this platform
  loop: "{{ certificate_trust }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate extended-format trust support
  ansible.builtin.assert:
    that:
      - >-
        item.type | d('anchor') != 'extended'
        or __certificate_trust_extended_dir is not none
    fail_msg: Extended-format trust files are not supported on this platform
  loop: "{{ certificate_trust }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure trust store packages are installed
  package:
    name: "{{ __certificate_trust_packages }}"
    state: present
    use: "{{ (__certificate_is_ostree | d(false)) |
      ternary('ansible.posix.rhel_rpm_ostree', omit) }}"
  register: __certificate_trust_packages_installed

- name: Set certificate_is_changed
  set_fact:
    certificate_is_changed: true
  when: __certificate_trust_packages_installed is changed  # noqa no-handler

- name: Install trust certificates
  copy:
    content: "{{ item.content | default(omit) }}"
    src: "{{ item.src | default(omit) }}"
    remote_src: "{{ item.remote_src | default(omit) }}"
    dest: >-
      {{ __certificate_trust_dirs[item.type | d('anchor')] }}/{{ item.name }}.crt
    owner: root
    group: root
    mode: "0644"
  loop: "{{ certificate_trust }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.state | d('present') == 'present'
    - item.content is defined or item.src is defined
  register: __certificate_trust_copied

- name: Set certificate_is_changed
  set_fact:
    certificate_is_changed: true
  when: __certificate_trust_copied is changed  # noqa no-handler

- name: Install trust certificates from URL
  get_url:
    url: "{{ item.url }}"
    dest: >-
      {{ __certificate_trust_dirs[item.type | d('anchor')] }}/{{ item.name }}.crt
    owner: root
    group: root
    mode: "0644"
  loop: "{{ certificate_trust }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.state | d('present') == 'present'
    - item.url is defined
  register: __certificate_trust_downloaded

- name: Set certificate_is_changed
  set_fact:
    certificate_is_changed: true
  when: __certificate_trust_downloaded is changed  # noqa no-handler

- name: Remove trust certificates
  file:
    path: >-
      {{ __certificate_trust_dirs[item.type | d('anchor')] }}/{{ item.name }}.crt
    state: absent
  loop: "{{ certificate_trust }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.state | d('present') == 'absent'
  register: __certificate_trust_removed

- name: Set certificate_is_changed
  set_fact:
    certificate_is_changed: true
  when: __certificate_trust_removed is changed  # noqa no-handler

- name: Update system trust store
  command: "{{ __certificate_update_trust_cli }}"
  changed_when: true
  when: __certificate_trust_copied is changed
    or __certificate_trust_downloaded is changed
    or __certificate_trust_removed is changed  # noqa no-handler
  register: __certificate_trust_updated

- name: Set certificate_is_changed
  set_fact:
    certificate_is_changed: true
  when: __certificate_trust_updated is changed  # noqa no-handler
